defaults:
  - _self_
  - override hydra/launcher: joblib

num_epochs: 10
num_train_sample: 1
validation: true
kl_type: mean
entropy_type: conditional
dataset: cifar10
gamma: 0.0
lambda_info: 0.1
run_id: "gamma_${gamma}_lambda_${lambda_info}_dataset_${dataset}"
base_dir: ./hydra_experiments
det_checkpoint: .hydra_experiments/"gamma_${gamma}_lambda_${lambda_info}/hydra_experiments/checkpoint10.pt

hydra:
  run:
    dir: ${base_dir}/${run_id}
  sweep:
    dir: ${base_dir}
    subdir: ${run_id}
  launcher:
    #_target_: hydra_plugins.hydra_joblib_launcher.joblib_launcher.JoblibLauncher
    n_jobs: 1
